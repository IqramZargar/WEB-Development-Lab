
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Events</title>
</head>
<body>

    <h2>JavaScript Event Handling</h2>

    <button onclick="showMessage()">Click Me</button>

    <p id="demo"></p>

    <script>
        function showMessage() {
            document.getElementById("demo").innerHTML =
                "Button Clicked Successfully!";
        }
    </script>

</body>
</html>
