
<!DOCTYPE html>
<html>
<head>
    <title>PHP Control Structures</title>
</head>
<body>

    <h2>PHP Control Structures</h2>

    <?php

        // Conditional Statement
        $marks = 75;

        if ($marks >= 40) {
            echo "Result: Pass<br>";
        } else {
            echo "Result: Fail<br>";
        }

        // For Loop
        echo "<h3>For Loop</h3>";

        for ($i = 1; $i <= 5; $i++) {
            echo $i . "<br>";
        }

        // While Loop
        echo "<h3>While Loop</h3>";

        $j = 1;

        while ($j <= 5) {
            echo $j . "<br>";
            $j++;
        }

    ?>

</body>
</html>
