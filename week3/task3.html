
<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors Example</title>

    <link rel="stylesheet" href="selectors.css">

</head>

<body>

    <h1 id="main-heading">CSS Selectors</h1>

    <p>
        This paragraph uses the element selector.
    </p>

    <p class="highlight">
        This paragraph uses the class selector.
    </p>

    <h2 class="highlight">
        Class Selector Example
    </h2>

    <div>
        <p>
            This paragraph is inside a div element.
        </p>
    </div>

    <h3>List of Programming Languages</h3>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Python</li>
    </ul>

    <input type="text" placeholder="Enter your name">

    <br><br>

    <button>Submit</button>

</body>
</html>
