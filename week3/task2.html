
<!DOCTYPE html>
<html>
<head>
    <title>Three Types of CSS</title>

    <!-- Internal CSS -->
    <style>

        body {
            background-color: lightyellow;
            font-family: Arial, sans-serif;
        }

        h2 {
            color: green;
            text-align: center;
        }

        p {
            color: darkblue;
            font-size: 18px;
        }

    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style2.css">

</head>

<body>

    <h1 style="color:red; text-align:center;">
        Welcome to CSS
    </h1>

    <h2>Internal CSS Example</h2>

    <p>
        This paragraph is styled using internal CSS.
    </p>

    <h3>Inline CSS Example</h3>

    <p style="color:purple; font-weight:bold;">
        This paragraph is styled using inline CSS.
    </p>

    <h3>External CSS Example</h3>

    <p class="external">
        This paragraph is styled using external CSS.
    </p>

</body>
</html>
