
<!DOCTYPE html>
<html>
<head>
    <title>Images, Links and Tables</title>
</head>
<body>

    <h1>HTML Images, Links and Tables</h1>

    <!-- Adding an Image -->
    <h2>Image Example</h2>

    <img src="https://placehold.co/300x200"
         alt="Sample Image"
         width="300"
         height="200">

    <!-- Adding a Link -->
    <h2>Link Example</h2>

    <p>
        Visit Google:
        <a href="https://www.google.com" target="_blank">
            Click Here
        </a>
    </p>

    <p>
        Visit YouTube:
        <a href="https://www.youtube.com" target="_blank">
            Open YouTube
        </a>
    </p>

    <!-- Creating a Table -->
    <h2>Student Information Table</h2>

    <table border="1" cellpadding="10">
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Course</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Rahul</td>
            <td>BCA</td>
            <td>85</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Ayesha</td>
            <td>BCA</td>
            <td>90</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Aman</td>
            <td>BCA</td>
            <td>78</td>
        </tr>
    </table>

</body>
</html>
